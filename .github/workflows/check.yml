name: check

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go vet ./...

      - name: Report unformatted files
        run: |
          unformatted="$(gofmt -l $(find . -path ./vendor -prune -o -name '*.go' -print))"
          if [ -n "$unformatted" ]; then
            echo "gofmt: unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      # -race matters here: the server serves concurrent device sessions and
      # the operation log is shared state.
      - run: go test -race -count=1 ./...

      - run: go build ./...
